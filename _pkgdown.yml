url: https://dayusun.github.io/skmle/

template:
  bootstrap: 5
  # pkgdown >= 2.0 defaults to math-rendering: mathml, which needs the 'katex'
  # R package (and so V8) at BUILD time.  Without it pkgdown silently emits the
  # raw $$...$$ into the page and loads no renderer, so every formula shows as
  # LaTeX source.  MathJax renders in the browser and needs nothing installed
  # wherever the site happens to be built.
  math-rendering: mathjax
  bslib:
    primary: "#1f5aa6"
    secondary: "#5b6b7a"
    success: "#217346"
    info: "#0f766e"
    warning: "#b45309"
    danger: "#b42318"

home:
  title: skmle
  description: >
    Kernel-weighted estimation when a longitudinal covariate is measured at
    times that do not line up with the outcome: transformed hazards models for
    survival outcomes, and generalised linear models for asynchronous
    longitudinal outcomes.

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [github]
  components:
    intro:
      text: Get Started
      href: index.html
    reference:
      text: Reference
      href: reference/index.html
    articles:
      text: Articles
      menu:
      - text: Getting Started with skmle
        href: articles/tutorial.html
      - text: Benchmarking skmle Against SurvSparse
        href: articles/benchmark_survsparse.html
    news:
      text: Changelog
      href: news/index.html
    github:
      icon: fab fa-github
      aria-label: GitHub repository
      href: https://github.com/dayusun/skmle

reference:
- title: Package overview
  contents:
  - skmle-package

- title: Survival models with sparse longitudinal covariates
  contents:
  - skmle
  - skmle_cv
  - kee_cox
  - kee_additive

- title: Asynchronous longitudinal regression
  desc: >
    Kernel-weighted estimating equations of Cao, Zeng and Fine (2015) for a
    response and a covariate observed on different time grids.
  contents:
  - kee_async
  - kee_async_td

- title: Simulation
  contents:
  - sim_skmle_data
  - sim_async_data

- title: Model summaries and plots
  contents:
  - plot.skmle
  - plot.kee_td
  - summary.skmle
  - summary.kee
  - print.skmle
  - print.kee
  - print.summary.skmle
  - print.summary.kee

articles:
- title: Articles
  navbar: Articles
  contents:
  - tutorial
  - benchmark_survsparse
